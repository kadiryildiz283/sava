[package]
name = "sava"
version = "0.1.0"
edition = "2021"
authors = ["SAVA Architecture Team"]
description = "Semantic AI Video Archive - Rust & Generative AI Codec"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
zstd = "0.13"
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
arc-swap = "1.6"
chrono = "0.4"
